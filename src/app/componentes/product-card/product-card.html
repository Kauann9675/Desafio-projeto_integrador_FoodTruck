<div class="product-card">

    <img 
        [src]="produto.imagem" 
        [alt]="produto.nome"
        class="product-image">

    <div class="product-content">

        <h3>{{ produto.nome }}</h3>

        <p>{{ produto.descricao }}</p>

        <div class="d-flex justify-content-between align-items-center">

            <span class="price">
                R$ {{ produto.preco.toFixed(2) }}
            </span>

            <button
                class="add-btn"
                (click)="adicionar()">

              + Adicionar

            </button>

        </div>

        <button class="ingredients-btn w-100 mt-2">
            Ver ingredientes
        </button>

    </div>

</div>
