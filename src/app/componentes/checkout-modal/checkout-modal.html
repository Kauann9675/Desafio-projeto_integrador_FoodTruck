<div class="checkout-modal">

    <div class="checkout-content">

        <!-- Cabeçalho -->
        <div class="d-flex justify-content-between align-items-center">

            <h2>Finalizar Pedido</h2>

            <button class="close-btn">
                ×
            </button>

        </div>


        <!-- Nome -->
        <div class="mb-3">

            <label for="nome" class="form-label">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                class="form-control"
                placeholder="Digite seu nome"
            >

        </div>


        <!-- CPF -->
        <div class="mb-3">

            <label for="cpf" class="form-label">
                CPF
            </label>

            <input
                type="text"
                id="cpf"
                class="form-control"
                placeholder="Digite seu CPF"
            >

        </div>


        <!-- Tipo de consumo -->
        <div class="mb-3">

            <label class="form-label">
                Tipo de consumo
            </label>

            <div class="d-flex gap-2">

                <button class="btn option-btn flex-fill">
                    Local
                </button>

                <button class="btn option-btn flex-fill">
                    Para Viagem
                </button>

            </div>

        </div>


        <!-- Pagamento -->
        <div class="mb-3">

            <label class="form-label">
                Forma de pagamento
            </label>

            <div class="d-flex flex-wrap gap-2">

                <button class="btn option-btn">
                    Cartão
                </button>

                <button class="btn option-btn">
                    PIX
                </button>

                <button class="btn option-btn">
                    Dinheiro
                </button>

            </div>

        </div>


        <!-- Total -->
        <div class="d-flex justify-content-between mb-3">

            <strong>
                Total:
            </strong>

            <strong>
                R$ 25,00
            </strong>

        </div>


        <!-- Confirmar -->
        <button class="btn confirm-btn w-100">
            Confirmar Pedido
        </button>

    </div>

</div>
