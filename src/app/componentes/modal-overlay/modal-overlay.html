<div class="modal-overlay" *ngIf="aberto">

    <div class="modal-box">

        <div class="d-flex justify-content-between align-items-center">

            <h2>
                Ingredientes
            </h2>

            <button class="close-btn">
                ×
            </button>

        </div>


        <p>
            Confira os ingredientes do produto.
        </p>


        <div id="ingredients-list">

            <ul class="list-group">

                <li class="list-group-item">
                    Hambúrguer
                </li>

                <li class="list-group-item">
                    Queijo
                </li>

                <li class="list-group-item">
                    Alface
                </li>

                <li class="list-group-item">
                    Tomate
                </li>

                <li class="list-group-item">
                    Molho especial
                </li>

            </ul>

        </div>


        <button class="btn confirm-btn w-100 mt-3">
            Confirmar
        </button>

    </div>

</div>
