<div
    class="order-card-new"
    *ngFor="let order of orders" >

    <h3>
        {{ order.customer }}
    </h3>

    <div>
        CPF: {{ order.cpf }}
    </div>

    <div>
        {{ order.date }} • {{ order.time }}
    </div>

    <strong>
        R$ {{ order.total.toFixed(2) }}
    </strong>

</div>
